<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // Preserve domain + protocol
        var l = window.location;

        // Keep the original client route (/about, /contact, etc.)
        // Normalize any leading slashes
        var path = l.pathname.replace(/^\/+/, "");

        // Reconstruct a full absolute URL on the SAME origin
        var target = l.origin + "/" + path + l.search + l.hash;

        // Send the browser to index.html on the same origin, *but* with the original path
        // so React Router can render the correct route.
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
