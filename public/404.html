<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; URL=/" />
    <script>
      // Redirect all 404s to index.html with the original path preserved
      var l = window.location;
      var redirectTo = '/' + l.pathname.replace(/^\/+/, '') + l.search + l.hash;
      location.replace('/' + (redirectTo === '/' ? '' : redirectTo));
    </script>
  </head>
  <body></body>
</html>
