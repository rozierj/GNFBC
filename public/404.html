<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // If this 404 page is shown (because /about, /contact, etc. doesn't exist on the server),
        // redirect to "/" but carry the original path in ?p= so the SPA can restore it.
        var l = window.location;
        // Only do this if we weren't already redirected here with ?p=
        if (!/[?&]p=/.test(l.search)) {
          var original = l.pathname + l.search + l.hash;
          var target = l.origin + "/?p=" + encodeURIComponent(original);
          l.replace(target);
        }
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/" /></noscript>
  </head>
  <body></body>
</html>
